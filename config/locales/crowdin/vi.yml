        description: Các giá trị được tính toán cho phép bạn tạo thuộc tính dựa trên công thức toán học bằng cách sử dụng các giá trị số cũng như các thuộc tính dự án và Custom field khác.
      capture_external_links:
        description: Ngăn chặn các cuộc tấn công xã hội bằng cách phát hiện và cảnh báo về các liên kết bên ngoài trước khi người dùng truy cập vào chúng.
      custom_actions:
        description: Hành động tùy chỉnh là các phím tắt một lần nhấp, chạy một nhóm hành động định sẵn mà bạn có thể áp dụng cho một số work package theo trạng thái, role, loại hoặc dự án.

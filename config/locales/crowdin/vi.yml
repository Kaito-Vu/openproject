  ldap_auth_sources:
    attribute_texts:
      admin_map_html: 'Tùy chọn: Khóa thuộc tính trong LDAP mà <strong>nếu có</strong> đánh dấu người dùng OpenProject là quản trị viên. Để trống khi nghi ngờ.'
      base_dn: |
        Nhập Base DN của cây con trong LDAP mà bạn muốn OpenProject tìm kiếm người dùng và nhóm.
        OpenProject sẽ chỉ lọc tên người dùng được cung cấp trong cây con này.
        Ví dụ: ou=users,dc=example,dc=com
      filter_string: |
        Thêm bộ lọc RFC4515 tùy chọn để áp dụng cho kết quả người dùng được lọc trong LDAP.
        Bộ lọc này giúp giới hạn tập người dùng mà OpenProject tìm thấy để xác thực và đồng bộ nhóm.
      filter_string_concat: |
        OpenProject luôn lọc theo thuộc tính đăng nhập do người dùng nhập để xác định bản ghi. Nếu bạn nhập bộ lọc ở đây,
        nó sẽ được nối với điều kiện đó bằng AND. Mặc định sẽ dùng bộ lọc bao quát (objectClass=*).
      generic_map: |-
        84/5000
        Khóa thuộc tính trong LDAP được ánh xạ tới thuộc tính `%{attribute}` của OpenProject
      host: Tên máy chủ LDAP hoặc địa chỉ IP
      login_map: Khóa thuộc tính trong LDAP được sử dụng để xác định thông tin đăng nhập người dùng duy nhất. Thông thường, đây sẽ là `uid` hoặc` samAccountName`.
      name: Tên tùy ý của kết nối LDAP
      onthefly_register: |
        Nếu chọn ô này, OpenProject sẽ tự động tạo người dùng mới từ mục LDAP của họ
        khi họ xác thực lần đầu với OpenProject.
        Bỏ chọn để chỉ cho phép các tài khoản đã có trong OpenProject xác thực qua LDAP!
      system_user_dn_html: |
        Nhập DN của người dùng hệ thống được sử dụng để truy cập chỉ đọc.
        <br>
        Ví dụ: uid=openproject,ou=system,dc=example,dc=com
      system_user_password: Nhập mật khẩu liên kết của người dùng hệ thống
    back_to_index: Bấm vào đây để quay lại danh sách kết nối.
    connection_encryption: Mã hóa kết nối
    encryption_details: Tùy chọn LDAPS / STARTTLS
    ldap_auth_failed: Không thể xác thực tại Máy chủ LDAP.
    ldap_details: 'Chi tiết LDAP '
    ldap_error: 'Lỗi LDAP: %{error_message}'
    sync_failed: 'Không thể đồng bộ hóa từ LDAP: %{message}.'
    system_account: Tài khoản hệ thống
    system_account_legend: |
      OpenProject cần quyền truy cập chỉ đọc qua một tài khoản hệ thống để tra cứu người dùng và nhóm trong cây LDAP của bạn.
      Vui lòng nhập thông tin bind cho tài khoản hệ thống đó ở phần sau.
    technical_warning: |
      Biểu mẫu LDAP này yêu cầu kiến ​​thức kỹ thuật về thiết lập LDAP/Active Directory của bạn.
      [Please visit our documentation for detailed instructions](docs_url).
    tls_mode:
      plain: Không có
      plain_description: Mở kết nối không được mã hóa đến máy chủ LDAP. Không được khuyến khích cho sản xuất.
      section_more_info_link_html: 'Phần này liên quan đến bảo mật kết nối của nguồn xác thực LDAP này. Để biết thêm thông tin, vui lòng truy cập <a href="%{link}"> tài liệu Net::LDAP</a>.

        '
      simple_tls: LDAPS
      simple_tls_description: Sử dụng LDAPS. Yêu cầu một cổng riêng trên máy chủ LDAP. Chế độ này thường không được dùng nữa, chúng tôi khuyên bạn nên sử dụng STARTTLS bất cứ khi nào có thể.
      start_tls: BẮT ĐẦU
      start_tls_description: Gửi lệnh STARTTLS sau khi kết nối với cổng LDAP tiêu chuẩn. Được khuyến nghị cho các kết nối được mã hóa.
    tls_options:
      tls_certificate_description: Nếu chứng chỉ máy chủ LDAP không có trong các nguồn tin cậy của hệ thống này, bạn có thể thêm chứng chỉ đó theo cách thủ công tại đây. Nhập chuỗi chứng chỉ PEM X509.
      verify_peer: Xác minh chứng chỉ SSL
      verify_peer_description_html: |
        Bật xác minh SSL nghiêm ngặt đối với chuỗi chứng chỉ tin cậy. <br> <strong>Cảnh báo:</strong> Bỏ chọn tùy chọn này sẽ tắt xác minh SSL của chứng chỉ máy chủ LDAP, khiến kết nối của bạn có nguy cơ bị tấn công man-in-the-middle.
    user_settings: Ánh xạ thuộc tính
    user_settings_legend: |
      Các trường sau liên quan đến cách tạo người dùng trong OpenProject từ mục LDAP và
      thuộc tính LDAP nào được dùng để xác định thuộc tính của người dùng OpenProject (ánh xạ thuộc tính).

        installation: Hỗ trợ cài đặt
        installation_text: Các kỹ sư phần mềm giàu kinh nghiệm sẽ hướng dẫn bạn toàn bộ quá trình cài đặt và thiết lập trên hạ tầng của riêng bạn.
        premium_features: Tiện ích bổ sung dành cho doanh nghiệp

      show_work_package_attachments: 'Việc tắt tùy chọn này sẽ ẩn danh sách Attachment trên tab tệp Work package cho các dự án mới. Các Attachment trong phần mô tả của Work package sẽ vẫn được tải lên bộ lưu trữ Attachment nội bộ.

        '
      whitelist_text_html: |
        Xác định danh sách đuôi tệp và/hoặc kiểu MIME hợp lệ cho các tệp tải lên. <br/> Nhập đuôi tệp (ví dụ: <code>%{ext_example}</code>) hoặc kiểu MIME (ví dụ: <code>%{mime_example}</code>). <br/> Để trống để cho phép tải lên mọi loại tệp. Có thể nhập nhiều giá trị (mỗi giá trị một dòng).
    authentication:
      login: Đăng nhập
      omniauth_direct_login_hint_html: |
        Nếu bật tùy chọn này, yêu cầu đăng nhập sẽ được chuyển hướng đến nhà cung cấp omniauth đã cấu hình. Danh sách đăng nhập thả xuống và trang đăng nhập sẽ bị vô hiệu hóa. <br/> <strong>Lưu ý:</strong> Nếu bạn không tắt đăng nhập bằng mật khẩu, người dùng vẫn có thể đăng nhập nội bộ qua trang đăng nhập <code>%{internal_path}</code>.
      password_login_bypass_principal_ids_hint: |
        Dù đăng nhập bằng mật khẩu đã bị tắt, những người dùng và nhóm này vẫn có thể dùng mật khẩu để đăng nhập. Điều này hữu ích, chẳng hạn khi nhà cung cấp danh tính không khả dụng. Nếu bạn thêm một nhóm, quyền này áp dụng cho mọi người dùng trong nhóm.
      password_login_configured_by_environment: |
        Các cài đặt sau được cấu hình qua môi trường và không thể chỉnh sửa tại đây:
      password_login_requires_sso_provider: |
        Không thể đặt hạn chế đăng nhập bằng mật khẩu vì hiện chưa có nhà cung cấp SSO nào được bật. Hãy cấu hình và bật một nhà cung cấp SSO trước khi thay đổi các cài đặt này.
      registration: Đăng ký
      remapping_existing_users_hint: |
        Nếu bật, mọi nhà cung cấp danh tính đã cấu hình có thể đăng nhập cho người dùng hiện có dựa trên tên người dùng, kể cả khi họ chưa từng đăng nhập qua nhà cung cấp đó. Cách này hữu ích khi chuyển hệ thống OpenProject sang nhà cung cấp SSO mới, nhưng không nên dùng với nhà cung cấp mà không phải mọi người dùng trong hệ thống đều tin cậy.
      sso: Đăng nhập một lần (SSO)

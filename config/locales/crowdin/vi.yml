        instructions_html: |
          Chọn hành động áp dụng cho các tệp bị phát hiện có virus: <br/> <ul> <li><strong>%{quarantine_option}</strong>: Cách ly tệp, không cho người dùng truy cập. Quản trị viên có thể xem và xóa các tệp bị cách ly trong phần quản trị.</li> <li><strong>%{delete_option}</strong>: Xóa tệp ngay lập tức.</li> </ul>
        quarantine: Cách ly tập tin
      clamav_ping_failed: Không thể kết nối trình nền ClamAV. Hãy kiểm tra kỹ cấu hình và thử lại.
      modes:
        clamav_host_html: 'Nhập tên máy chủ và cổng vào trình nền Clamd được phân tách bằng dấu hai chấm. ví dụ: %{example}'
        clamav_socket_html: 'Nhập ổ cắm vào daemon ngao, ví dụ: %{example}'
        description_html: |
          Chọn chế độ hoạt động của tích hợp trình quét virus. <br/> <ul> <li><strong>%{disabled_option}</strong>: Không quét virus các tệp tải lên.</li> <li><strong>%{socket_option}</strong>: Bạn đã cài ClamAV trên cùng máy chủ với OpenProject và daemon quét clamd đang chạy nền.</li> <li><strong>%{host_option}</strong>: Bạn đang truyền tệp đến một máy chủ quét virus bên ngoài.</li> </ul>
      remaining_quarantined_files_html: 'Quét virus đã bị vô hiệu hóa. Có %{file_count} tệp vẫn còn trong cách ly. Để xem các tệp đã cách ly, vui lòng truy cập liên kết này: %{link}

        '
      remaining_rescanned_files: |
        Đã bật quét virus thành công. Có %{file_count} được tải lên trước đó và cần được quét. Quá trình này đã được lên lịch chạy nền. Các tệp vẫn truy cập được trong lúc quét.
      remaining_scan_complete_html: 'Các tập tin còn lại đã được quét. Có %{file_count} đang bị cách ly. Bạn đang được chuyển hướng đến trang cách ly. Sử dụng trang này để xóa hoặc ghi đè các tập tin đã cách ly.

        '
      title: Quét virus
    attachments:

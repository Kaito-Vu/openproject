# =============================================================================
# OpenProject - PRODUCTION RUN stack (no build, pulls pre-built images only).
#
# Build/push images with docker-compose.production.yml, then on the server:
#
#   cp .env.production.example .env.production
#   $EDITOR .env.production      # set TAG, image names, secrets
#   docker compose --env-file .env.production -f docker-compose-run-production.yaml pull
#   docker compose --env-file .env.production -f docker-compose-run-production.yaml up -d
#
#   docker compose --env-file .env.production -f docker-compose-run-production.yaml ps
#   docker compose --env-file .env.production -f docker-compose-run-production.yaml logs -f web worker
#   docker compose --env-file .env.production -f docker-compose-run-production.yaml down
#
# PostgreSQL is NOT part of this stack: set DATABASE_URL to your external database
# (e.g. postgres://user:pass@db-host:5432/openproject?pool=20&encoding=unicode&reconnect=true).
# Same project name and volumes as docker-compose.production.yml (opdata).
#
# Only ./docker/nginx/openproject.conf is needed from the repository (bind-mounted).
# Images: OPENPROJECT_IMAGE / HOCUSPOCUS_IMAGE / DEUNHEALTH_IMAGE may point to
# your private registry (e.g. registry.example.com/openproject/openproject).
# =============================================================================

name: openproject-production

networks:
  frontend:
  backend:

volumes:
  opdata:

x-restart: &restart
  restart: unless-stopped

x-image: &image
  image: ${OPENPROJECT_IMAGE:-openproject/openproject}:${TAG:-17}
  pull_policy: ${PULL_POLICY:-missing}

x-app: &app
  <<: [*image, *restart]
  environment:
    OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
    OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:?set OPENPROJECT_HOST__NAME}"
    OPENPROJECT_ADDITIONAL__HOST__NAMES: "${OPENPROJECT_ADDITIONAL__HOST__NAMES:-web}"
    OPENPROJECT_HSTS: "${OPENPROJECT_HSTS:-false}"
    OPENPROJECT_LOG__LEVEL: "${OPENPROJECT_LOG__LEVEL:-info}"
    OPENPROJECT_RAILS__CACHE__STORE: memcache
    OPENPROJECT_CACHE__MEMCACHE__SERVER: cache:11211
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: "${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}"
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: "${COLLABORATIVE_SERVER_URL:-ws://${OPENPROJECT_HOST__NAME}/hocuspocus}"
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET: "${COLLABORATIVE_SERVER_SECRET:?set COLLABORATIVE_SERVER_SECRET}"
    DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
    RAILS_MIN_THREADS: "${RAILS_MIN_THREADS:-4}"
    RAILS_MAX_THREADS: "${RAILS_MAX_THREADS:-16}"
    IMAP_ENABLED: "${IMAP_ENABLED:-false}"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE}"
    # Microsoft Entra ID (OIDC). Redirect URI: https://<OPENPROJECT_HOST__NAME>/auth/entra/callback
    # OPENPROJECT_OPENID__CONNECT_ENTRA_DISPLAY__NAME: "${ENTRA_DISPLAY_NAME:-Microsoft}"
    # OPENPROJECT_OPENID__CONNECT_ENTRA_HOST: login.microsoftonline.com
    # OPENPROJECT_OPENID__CONNECT_ENTRA_IDENTIFIER: "${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID}"
    # OPENPROJECT_OPENID__CONNECT_ENTRA_SECRET: "${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET}"
    # OPENPROJECT_OPENID__CONNECT_ENTRA_ISSUER: "https://login.microsoftonline.com/${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID}/v2.0"
    # OPENPROJECT_OPENID__CONNECT_ENTRA_SCOPE: "[openid,email,profile]"
    # OPENPROJECT_OPENID__CONNECT_ENTRA_AUTHORIZATION__ENDPOINT: "/${ENTRA_TENANT_ID}/oauth2/v2.0/authorize"
    # OPENPROJECT_OPENID__CONNECT_ENTRA_TOKEN__ENDPOINT: "/${ENTRA_TENANT_ID}/oauth2/v2.0/token"
    # OPENPROJECT_OPENID__CONNECT_ENTRA_USERINFO__ENDPOINT: "https://graph.microsoft.com/oidc/userinfo"
    # OPENPROJECT_OPENID__CONNECT_ENTRA_END__SESSION__ENDPOINT: "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/logout"
  volumes:
    - "${OPDATA:-opdata}:/var/openproject/assets"

services:
  cache:
    image: memcached:1.6-alpine
    <<: *restart
    networks:
      - backend

  proxy:
    image: nginx:1.31.6-alpine
    <<: *restart
    volumes:
      - ./docker/nginx/openproject.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      web:
        condition: service_started
      hocuspocus:
        condition: service_started
    networks:
      - frontend

  web:
    <<: *app
    command: ./docker/prod/web
    networks:
      - frontend
      - backend
    depends_on:
      cache:
        condition: service_started
      seeder:
        condition: service_completed_successfully
    labels:
      - deunhealth.restart.on.unhealthy=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}/health_checks/default"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Optional sidecar: restarts containers whose Docker healthcheck turns unhealthy.
  # Opt-in via the "deunhealth" profile because it mounts the Docker socket:
  #   docker compose ... --profile deunhealth up -d
  deunhealth:
    <<: *restart
    image: ${DEUNHEALTH_IMAGE:-openproject/deunhealth}:${DEUNHEALTH_TAG:-local}
    pull_policy: ${PULL_POLICY:-missing}
    profiles: ["deunhealth"]
    network_mode: none
    # Runs as nonroot (65532) and needs the docker socket's group to talk to it.
    # Linux: DOCKER_GID=$(stat -c %g /var/run/docker.sock)
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      LOG_LEVEL: info

  worker:
    <<: *app
    command: ./docker/prod/worker
    networks:
      - backend
    depends_on:
      cache:
        condition: service_started
      seeder:
        condition: service_completed_successfully

  cron:
    <<: *app
    command: ./docker/prod/cron
    networks:
      - backend
    depends_on:
      cache:
        condition: service_started
      seeder:
        condition: service_completed_successfully

  seeder:
    <<: *app
    command: ./docker/prod/seeder
    restart: on-failure
    networks:
      - backend
    depends_on:
      cache:
        condition: service_started

  hocuspocus:
    image: ${HOCUSPOCUS_IMAGE:-openproject/hocuspocus}:${HOCUSPOCUS_TAG:-17.9.1-patched}
    pull_policy: ${PULL_POLICY:-missing}
    <<: *restart
    environment:
      SECRET: "${COLLABORATIVE_SERVER_SECRET:?set COLLABORATIVE_SERVER_SECRET}"
      OPENPROJECT_URL: "${OPENPROJECT_URL:-http://web:8080}"
      OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-false}"
    networks:
      - backend
      - frontend

    '
  text_github_webhook_secret_info: |
    Token bí mật được chia sẻ với GitHub khi cấu hình webhook. Khi được đặt, OpenProject sẽ xác minh header X-Hub-Signature-256 trên mọi yêu cầu gửi đến và từ chối các payload không khớp. Để trống nếu muốn bỏ qua việc xác minh (không khuyến nghị).
  text_github_webhook_secret_missing_warning: |
    Chưa cấu hình webhook secret. Mọi yêu cầu gửi đến endpoint webhook GitHub sẽ được chấp nhận mà không xác minh, có thể cho phép kẻ gian giả mạo sự kiện. Chúng tôi đặc biệt khuyến nghị bạn nên đặt secret.
  text_pull_request_deployed_to: "%{pr_link} được triển khai tới %{deploy_target_link}"

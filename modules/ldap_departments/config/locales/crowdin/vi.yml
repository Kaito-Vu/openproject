        title: Gỡ bỏ đồng bộ hóa %{name}
      form:
        auth_source_text: Chọn kết nối LDAP sẽ được sử dụng.
        base_dn_text: |
          Nhập Base DN có các đơn vị tổ chức cần đồng bộ. Các OU con trực tiếp của nó sẽ trở thành phòng ban cấp cao nhất. Base DN này phải nằm dưới Base DN của kết nối LDAP đã chọn.
        guid_attribute_text: |
          Tùy chọn. Thuộc tính LDAP chứa mã định danh duy nhất ổn định (ví dụ "objectGUID" hoặc "entryUUID"). Khi đã đặt, phòng ban vẫn được giữ nguyên khi OU bị đổi tên hoặc di chuyển. Để trống để đối chiếu theo DN.
        ou_name_attribute_text: Thuộc tính LDAP dùng để đặt tên cho phòng ban (ví dụ "ou").
        sections:
          connection: Kết nối LDAP
          structure: Đơn vị tổ chức
          users: Người dùng
        structure_filter_string_text: Bộ lọc LDAP RFC4515 để xác định các mục đơn vị tổ chức.
        sync_users_text: |
          Nếu bật, những người dùng tìm thấy dưới Base DN cũng sẽ được tạo trong OpenProject. Nếu tắt, chỉ các tài khoản hiện có được gán vào phòng ban.
        user_filter_string_text: |
          Tùy chọn. Bộ lọc LDAP RFC4515 để xác định các mục người dùng. Để trống để dùng bộ lọc của kết nối, hoặc bộ lọc person chung nếu chưa đặt.
      help_text: |
        Module này phản chiếu cấu trúc đơn vị tổ chức (OU) trong thư mục LDAP vào cây phòng ban của OpenProject. Mỗi OU bên dưới Base DN đã cấu hình sẽ trở thành một phòng ban, và người dùng được gán vào phòng ban của OU chứa họ. Các phòng ban được đồng bộ định kỳ bằng cron job.
      no_results: Chưa cấu hình đồng bộ hóa phòng ban LDAP nào.
      plural: Đồng bộ hóa phòng ban LDAP
      singular: Đồng bộ hóa phòng ban LDAP
      synchronization_started: Đồng bộ hóa đã bắt đầu ở chế độ nền. Các phòng ban sẽ xuất hiện khi hoàn tất.

          '
      help_text_html: |
        Module này cho phép bạn thiết lập đồng bộ giữa nhóm LDAP và nhóm OpenProject.
        <br/>
        Mặc định, OpenProject dùng <strong>tra cứu ngược</strong>: tìm những người dùng có thuộc tính <em>memberOf</em> khớp với DN của nhóm.
        Cách này yêu cầu thuộc tính <em>memberOf</em> có trên các mục người dùng (Active Directory, OpenLDAP có memberof overlay).
        <br/>
        Nếu máy chủ LDAP của bạn không duy trì <em>memberOf</em> trên các mục người dùng (ví dụ dùng <em>groupOfUniqueNames</em> với <em>uniqueMember</em>),
        bạn có thể dùng <strong>tra cứu xuôi</strong> bằng cách đặt <em>Thuộc tính thành viên nhóm</em> trên bộ lọc đồng bộ.
        <br/>
        Các nhóm được đồng bộ hàng giờ bằng cron job.
        [Vui lòng xem tài liệu về chủ đề này](docs_url).
      no_members: Nhóm này chưa có thành viên đồng bộ nào.

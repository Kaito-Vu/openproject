  project_module_gitlab: GitLab
  text_gitlab_actor_info: |
    Người dùng OpenProject có khóa API được dùng để xác thực các yêu cầu webhook gửi đến. Khi đã đặt, các yêu cầu xác thực bằng thông tin của người dùng khác sẽ bị từ chối. Người dùng này cũng đăng các bình luận tự động trên work package. Nếu chưa đặt, mặc định là người dùng hệ thống.
  text_gitlab_webhook_secret_info: |
    Token bí mật chia sẻ với GitLab khi cấu hình webhook. Khi đã đặt, OpenProject sẽ kiểm tra header X-Gitlab-Token của mọi yêu cầu gửi đến và từ chối các payload không khớp. Để trống để bỏ qua việc kiểm tra (không khuyến nghị).
  text_gitlab_webhook_secret_missing_warning: |
    Chưa cấu hình webhook secret. Mọi yêu cầu gửi đến endpoint webhook GitLab sẽ được chấp nhận mà không kiểm tra, có thể cho phép kẻ xấu giả mạo sự kiện. Bạn nên đặt secret.

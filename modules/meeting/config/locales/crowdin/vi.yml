  text_meeting_draft_description: Chuẩn bị chương trình nghị sự của bạn ở chế độ dự thảo. Meeting này sẽ không gửi bất kỳ cập nhật lịch hoặc lời mời nào, ngay cả khi bạn thay đổi chi tiết Meeting hoặc thêm/xóa người tham gia.
  text_meeting_empty_description1: Bắt đầu bằng cách thêm các mục chương trình nghị sự bên dưới. Mỗi mục có thể đơn giản chỉ là tiêu đề nhưng bạn cũng có thể thêm các chi tiết bổ sung như thời lượng và ghi chú.
  text_meeting_empty_description2: Bạn cũng có thể thêm tài liệu tham khảo vào các Work package hiện có. Khi bạn làm như vậy, các ghi chú liên quan sẽ tự động hiển thị trong tab "Meeting" của Work package.
  text_meeting_empty_heading: Meeting của bạn trống

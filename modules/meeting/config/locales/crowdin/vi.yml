  text_meeting_template_sharing_description: Mẫu này có thể được chia sẻ với các dự án con hoặc các dự án khác trong hệ thống. Chỉ các mục chương trình họp và tệp đính kèm được sao chép.
  text_notificiation_invited: 'Thư này chứa mục nhập ics cho Meeting bên dưới:'
  text_onetime_meeting_template_banner: Bạn đang chỉnh sửa một mẫu cuộc họp. Bạn có thể dùng mẫu này để tạo các cuộc họp một lần với chương trình họp định sẵn. Thay đổi sẽ không ảnh hưởng đến các cuộc họp đã tạo.
  text_onetime_meeting_template_empty_description: Thêm các mục chương trình họp, phần và tệp đính kèm tại đây. Chúng sẽ được đưa vào mọi cuộc họp tạo từ mẫu này.
  text_onetime_meeting_template_empty_heading: Mẫu cuộc họp này đang trống

    '
  text_series_backlog_clear_description: 'Thao tác này sẽ xóa tất cả các mục trong Backlog của chuỗi Meeting, được chia sẻ với tất cả các Meeting trong chuỗi. Bạn có chắc chắn muốn tiếp tục không? Hành động này không thể đảo ngược.

    '

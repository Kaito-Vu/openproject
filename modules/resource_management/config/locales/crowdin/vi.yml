        title: Quản lý nguồn lực
  label_resource_management: Quản lý nguồn lực
  permission_allocate_user_resources: Phân bổ nguồn lực người dùng
  permission_allocate_user_resources_explanation: Cho phép người dùng tạo, cập nhật và xóa phân bổ nguồn lực trong bảng lập kế hoạch nguồn lực. Bao gồm việc gán người dùng (hoặc bộ lọc người dùng) vào bảng lập kế hoạch và điều chỉnh thời gian phân bổ cũng như khoảng ngày.
  permission_assign_users_to_generic_allocations: Gán người dùng vào các phân bổ chung
  permission_assign_users_to_generic_allocations_explanation: Cho phép người dùng sử dụng view Nhân sự để gán người dùng thực vào các phân bổ nguồn lực chung (dựa trên bộ lọc) chưa có người dùng. Không cho phép tạo hoặc chỉnh sửa phân bổ.
  permission_manage_public_global_resource_planners: Quản lý bảng lập kế hoạch nguồn lực toàn cục công khai
  permission_manage_public_global_resource_planners_explanation: Cho phép người dùng công khai bảng lập kế hoạch nguồn lực toàn cục của mình và quản lý các bảng toàn cục mà người dùng khác đã chia sẻ công khai. Không cho phép xem các bảng lập kế hoạch nguồn lực toàn cục chưa được chia sẻ công khai.
  permission_manage_public_resource_planners: Quản lý bảng lập kế hoạch nguồn lực công khai
  permission_manage_public_resource_planners_explanation: Cho phép người dùng tạo và quản lý bảng lập kế hoạch nguồn lực công khai. Họ có thể xem, tạo, quản lý và công khai các bảng lập kế hoạch nguồn lực của chính mình. Không cho phép xem các bảng do người dùng khác tạo mà chưa được chia sẻ công khai.
  permission_view_global_resource_planners: Xem bảng lập kế hoạch nguồn lực toàn cục
  permission_view_global_resource_planners_explanation: Cho phép người dùng truy cập phần lập kế hoạch nguồn lực toàn cục, nơi có thể lập kế hoạch chung cho nguồn lực và phân bổ từ nhiều dự án. Họ có thể tạo và quản lý bảng toàn cục của mình và xem các bảng công khai. Người dùng chỉ thấy những dự án, nguồn lực và phân bổ mà họ được phép xem.
  permission_view_resource_planners: Xem bảng lập kế hoạch nguồn lực
  permission_view_resource_planners_explanation: Cho phép người dùng truy cập bảng lập kế hoạch nguồn lực. Họ có thể tạo và quản lý bảng của mình và xem các bảng công khai. Không cho phép xem các bảng do người dùng khác tạo mà chưa được chia sẻ công khai.

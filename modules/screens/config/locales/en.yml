  activerecord:
    attributes:
      screen:
        name: Name
        description: Description
        screen_type: Type
        active: Active
      screen_section:
        name: Name
        position: Position
      screen_item:
        field_key: Field
        position: Position
        width: Width
        visible: Visible
      screen_scheme:
        name: Name
        description: Description
        items: Types
      screen_scheme_item:
        type: Type
        create_screen: Create screen
        edit_screen: Edit screen
        view_screen: View screen
        transition_screen: Transition screen
      project_screen_scheme:
        scheme: Screen scheme
    errors:
      models:
        screen:
          attributes:
            name:
              blank: cannot be blank.
              taken: is already taken.
              too_long: is too long (maximum is %{count} characters).
            description:
              too_long: is too long (maximum is %{count} characters).
            screen_type:
              blank: cannot be blank.
              inclusion: is not a valid screen type.
            base:
              cannot_be_deleted: Screens cannot be deleted. Deactivate them instead.
              required_not_placed: A create screen in use must place the required fields.
              conflict: was changed by someone else. Reload and try again.
              too_many_sections: The layout has too many sections.
              too_many_items: The layout has too many items.
              duplicate_field: A field can only be placed once on a screen.
              unknown_field: The layout contains a field that cannot be placed.
              invalid_width: The layout contains an item with an invalid width.
        screen_section:
          attributes:
            name:
              blank: cannot be blank.
              taken: must be unique within the screen.
              too_long: is too long (maximum is %{count} characters).
            position:
              not_an_integer: must be a whole number.
              greater_than_or_equal_to: must be greater than or equal to %{count}.
              less_than: must be less than %{count}.
        screen_item:
          attributes:
            field_key:
              blank: cannot be blank.
              invalid: must be a lowercase field key.
              taken: is already placed on this screen.
              too_long: is too long (maximum is %{count} characters).
            width:
              inclusion: is not a valid width.
            position:
              not_an_integer: must be a whole number.
              greater_than_or_equal_to: must be greater than or equal to %{count}.
              less_than: must be less than %{count}.
        screen_scheme:
          attributes:
            name:
              blank: cannot be blank.
              taken: is already taken.
              too_long: is too long (maximum is %{count} characters).
            description:
              too_long: is too long (maximum is %{count} characters).
            items:
              duplicate_types: must not contain the same type more than once.
              too_many: must not contain more than %{count} rows.
            base:
              cannot_be_deleted: Screen schemes cannot be deleted. Deactivate them instead.
              required_not_placed: "The create screen does not place required fields: %{fields}."
              hidden_and_required: "Fields are required but hidden by field rules: %{fields}."
        screen_scheme_item:
          attributes:
            type_id:
              taken: must be unique within the scheme.
            base:
              at_least_one_screen: needs at least one screen.
            create_screen:
              context_mismatch: must be a create screen.
            edit_screen:
              context_mismatch: must be an edit screen.
            view_screen:
              context_mismatch: must be a view screen.
            transition_screen:
              context_mismatch: must be a transition screen.
        project_screen_scheme:
          attributes:
            scheme:
              inactive: must be active.
            base:
              required_not_placed: "The create screen does not place required fields: %{fields}."
              hidden_and_required: "Fields are required but hidden by field rules: %{fields}."
  js:
    screens:
      sortable:
        moved: "%{field} moved to %{section}, position %{position} of %{total}"

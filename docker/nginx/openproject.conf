# Behind an F5 that terminates TLS. Trust its X-Forwarded-Proto, default to https.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

# WebSocket upgrade for /hocuspocus
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    # Collaborative editing websocket
    location /hocuspocus {
        rewrite ^/hocuspocus/?(.*)$ /$1 break;
        proxy_pass http://hocuspocus:1234;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Plain-HTTP reverse proxy for the production run stack (put TLS in front if needed).
# /hocuspocus is proxied (prefix stripped) to the collaborative-editing server.

# Access log: JSON, one object per line (easy for Loki/ELK/jq). Written to stdout
# so `docker compose logs proxy` and the Docker log driver pick it up.
# Times are in seconds: request_time = total, upstream_* = time spent in the app.
log_format json_main escape=json
	'{'
	'"time":"$time_iso8601",'
	'"request_id":"$request_id",'
	'"remote_addr":"$remote_addr",'
	'"x_forwarded_for":"$http_x_forwarded_for",'
	'"host":"$host",'
	'"method":"$request_method",'
	'"uri":"$request_uri",'
	'"protocol":"$server_protocol",'
	'"status":$status,'
	'"bytes_sent":$body_bytes_sent,'
	'"request_length":$request_length,'
	'"request_time":$request_time,'
	'"upstream_addr":"$upstream_addr",'
	'"upstream_status":"$upstream_status",'
	'"upstream_response_time":"$upstream_response_time",'
	'"location":"$upstream_http_location",'
	'"referer":"$http_referer",'
	'"user_agent":"$http_user_agent"'
	'}';

error_log  /dev/stderr warn;

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80 default_server;
	server_name _;

	# Server-level access_log replaces the image default (combined format) so each
	# request is logged once, in JSON.
	access_log /dev/stdout json_main;
	client_max_body_size 0;

	gzip on;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

	location /hocuspocus/ {
		proxy_pass http://hocuspocus:1234/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_read_timeout 3600s;
	}

	location / {
		proxy_pass http://web:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Request-Id $request_id;
		proxy_read_timeout 300s;
	}
}

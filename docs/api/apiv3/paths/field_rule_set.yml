# /api/v3/field_rule_sets/{id}
---
get:
  summary: Get a field rule set
  operationId: get_field_rule_set
  tags:
    - Field Rules
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  description: |-
    Administrators can read every rule set. Other users can read a rule set only if it is assigned to a project
    where they have the view work packages permission; otherwise 404 is returned.

    **Required permission:** logged-in user
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/field_rule_set_model.yml'
    '401':
      description: Returned if the client is not authenticated.
    '404':
      description: Returned if the rule set does not exist or is not visible to the user.
patch:
  summary: Update a field rule set
  operationId: update_field_rule_set
  tags:
    - Field Rules
  description: |-
    Updates name, description, `active` and replaces `rules`. Rule sets cannot be deleted; set `active` to `false` instead.

    **Required permission:** administrator
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/field_rule_set_model.yml'
    '403':
      description: Returned if the user is not an administrator.
    '404':
      description: Returned if the rule set does not exist.
    '422':
      description: Returned if a rule is invalid.

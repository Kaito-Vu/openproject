# /api/v3/projects/{id}/type_scheme
---
put:
  summary: Assign a type scheme to a project
  operationId: assign_project_type_scheme
  tags:
    - Type Schemes
  description: |-
    Assigns the active scheme with the given `scheme_id` to the project. An empty, unknown or inactive `scheme_id` is rejected; the assignment cannot be cleared through the API.

    This resource only supports `PUT`. To read the types a project may use, call
    `GET /api/v3/projects/{id}/available_types`.

    Without an explicit assignment, a project uses the default scheme only while the setting
    `type_scheme_auto_assign_default` is on. When it is off, projects without an assignment are not
    filtered at all (native behavior).

    **Required permission:** assign type scheme (in the project)
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            scheme_id:
              type: integer
  responses:
    '204':
      description: No Content
    '401':
      description: Returned if the client is not authenticated.
    '403':
      description: Returned if the user lacks the permission.
    '404':
      description: Returned if the project is not visible to the user or the scheme does not exist.
    '422':
      description: Returned if the scheme is missing, unknown or inactive.

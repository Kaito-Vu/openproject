# /api/v3/screen_schemes/{id}
---
get:
  summary: Get a screen scheme
  operationId: get_screen_scheme
  tags:
    - Screens
  description: |-
    Administrators can read every screen scheme. Other users can read a scheme only if it is assigned to a project
    where they have the view work packages permission; otherwise 404 is returned. Anonymous access is not allowed.

    **Required permission:** logged-in user
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/screen_scheme_model.yml'
    '401':
      description: Returned if the client is not authenticated.
    '404':
      description: Returned if the scheme does not exist or is not visible to the user.
patch:
  summary: Update a screen scheme
  operationId: update_screen_scheme
  tags:
    - Screens
  description: |-
    Updates name, description, active or the whole `typeItems` list.

    **Required permission:** administrator
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../components/schemas/screen_scheme_model.yml'
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/screen_scheme_model.yml'
    '401':
      description: Returned if the client is not authenticated.
    '403':
      description: Returned if the user is not an administrator.
    '404':
      description: Returned if the scheme does not exist.
    '422':
      description: Returned if the update is invalid.

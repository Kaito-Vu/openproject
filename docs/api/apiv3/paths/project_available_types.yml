# /api/v3/projects/{id}/available_types
---
get:
  summary: List the types available for new work packages in a project
  operationId: list_project_available_types
  tags:
    - Type Schemes
  description: |-
    Types that can be chosen when creating a work package, in the order defined by the project's type scheme
    (default type first). Without a scheme these are the types enabled in the project: a project that
    has no assignment is not filtered when the setting `type_scheme_auto_assign_default` is off.

    If the scheme of the project has types but none of them is enabled in the project, the scheme is not
    applied (fail-open): the response lists the types enabled in the project and carries the header
    `X-Type-Scheme-Warning: no_enabled_types`.

    **Required permission:** view work packages
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: '../components/schemas/collection_model.yml'
      headers:
        X-Type-Scheme-Warning:
          description: Set to `no_enabled_types` when the scheme of the project is not applied because none of its types is enabled in the project.
          schema:
            type: string
            enum:
              - no_enabled_types
    '403':
      description: Returned if the user may not view work packages in the project.
    '404':
      description: Returned if the project does not exist or is not visible to the user.

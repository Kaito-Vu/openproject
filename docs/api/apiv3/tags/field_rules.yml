description: |-
  Field rules tighten the native work package form per project and type: a rule can hide a field, make it required,
  make it read-only for users, or give it a default value for new work packages. A **field rule set** holds the rules,
  a **field rule scheme** assigns a rule set to each type, and a scheme is assigned to projects.

  Rules never add data and never delete existing values. Hidden fields keep their stored value (still returned in work
  package payloads) but cannot be written. Rule sets and schemes cannot be deleted, only deactivated.

  ## Reading and permissions

  Reading rule sets and schemes needs a logged-in user (anonymous requests get 401). Administrators see all of them;
  other users only see those tied to projects where they have the view work packages permission, everything else
  returns 404 (never 403, so existence is not revealed). Writing needs an administrator (there is no separate
  `manage_field_rules` permission). The resolved rules of one project and type are readable with the view work
  packages permission in that project.

  ## Grandfather warning

  The work package schema marks a property with `requiredButEmpty: true` when an existing work package has no value
  for a field that is now required by a rule. It never blocks saving; it lets a form show that the field is required
  but empty.

  ## Local Properties of a rule set

  | Property    | Description                                              | Type   | Supported operations |
  | :---------: | -------------------------------------------------------- | ------ | -------------------- |
  | id          | Rule set id                                              | Integer| READ                 |
  | name        | Unique name                                              | String | READ / WRITE         |
  | description |                                                          | String | READ / WRITE         |
  | active      | Inactive rule sets do not apply                          | Boolean| READ / WRITE         |
  | rules       | Objects with `fieldKey`, `hidden`, `required`, `readOnly`, `enforceOnUpdate`, `defaultValue`, `position` | Array | READ / WRITE |
name: Field Rules
